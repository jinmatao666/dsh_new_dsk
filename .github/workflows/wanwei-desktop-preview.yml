# Build the Wanwei Buddy desktop. This workflow is manual-only and
# has no image, registry, OneAPI deployment, or database steps.
name: Wanwei Buddy desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        default: new-version
        type: string
      version:
        description: Release version without the v prefix (for example 2.1.0)
        required: true
        type: string
      publish_github_release:
        description: Publish the generated installers as a GitHub Release
        required: true
        default: false
        type: boolean
      build_update_bundles:
        description: Generate signed desktop update bundles (requires signing Secrets and public-key variable)
        required: true
        default: false
        type: boolean

concurrency:
  group: wanwei-desktop-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22.19.0'
  DSH_RELEASE_VERSION: ${{ inputs.version }}
  DSH_DESKTOP_SERVER_URL: ${{ vars.DSH_ONEAPI_URL || 'http://ac.zjugis.com:3300' }}
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify-official:
    name: Verify official DSH composition
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-official-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product boundaries
        run: pnpm --dir products/wanwei-desktop run check:boundaries

      - name: Build official DSH composition
        run: pnpm run build:official

  build-desktop:
    name: Build ${{ matrix.name }} installer
    needs: verify-official
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-x64
            runner: windows-2025
            bundles: nsis
          - name: macOS arm64
            platform: macos-arm64
            runner: macos-15
            bundles: app
          - name: macOS Intel x64
            platform: macos-x64
            runner: macos-15-intel
            bundles: app
          - name: Linux x64
            platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
          - name: Linux ARM64
            platform: linux-arm64
            runner: ubuntu-22.04-arm
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-wanwei-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            musl \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils \
            zsync
          # The staged runtime contains a static musl launcher. linuxdeploy
          # looks up its interpreter marker as a shared-library SONAME, while
          # Ubuntu exposes musl under the loader path below.
          case "$(uname -m)" in
            x86_64) musl_arch=x86_64; library_arch=x86_64-linux-gnu ;;
            aarch64) musl_arch=aarch64; library_arch=aarch64-linux-gnu ;;
            *) echo 'Unsupported Linux desktop architecture' >&2; exit 1 ;;
          esac
          test -f "/lib/ld-musl-$musl_arch.so.1"
          sudo ln -sf "/lib/ld-musl-$musl_arch.so.1" "/usr/lib/$library_arch/libc.musl-$musl_arch.so.1"
          sudo ldconfig

      - name: Cache Rust and Tauri output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            products/wanwei-desktop/src-tauri/target
          key: ${{ matrix.platform }}-wanwei-${{ hashFiles('products/wanwei-desktop/src-tauri/Cargo.lock', 'products/wanwei-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-wanwei-

      - name: Validate inputs and prepare platform config
        env:
          DSH_BUILD_UPDATES: ${{ inputs.build_update_bundles }}
          DSH_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DSH_DESKTOP_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node products/wanwei-desktop/scripts/prepare-runner-config.mjs ${{ matrix.platform }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Wanwei product identity
        run: pnpm --dir products/wanwei-desktop run check:identity

      - name: Verify installer preserves user data
        run: pnpm --dir products/wanwei-desktop run check:installer-data

      - name: Verify Wanwei product boundaries
        run: pnpm --dir products/wanwei-desktop run check:boundaries

      - name: Build DSH and desktop assets
        run: pnpm --dir products/wanwei-desktop run dev:prepare

      - name: Stage self-contained runtime
        run: pnpm --dir products/wanwei-desktop run prepare:runtime

      # pnpm's legacy production deploy prunes workspace development packages.
      # Restore the locked build toolchain before invoking the Tauri CLI.
      - name: Restore installer build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify staged runtime and sidecar
        run: pnpm --dir products/wanwei-desktop run check:runtime

      # The target directory is cached to speed up Rust compilation, but bundle
      # outputs are versioned artifacts and must never survive between runs.
      - name: Clear stale installer outputs
        run: |
          node -e "require('node:fs').rmSync('products/wanwei-desktop/src-tauri/target/release/bundle', { recursive: true, force: true })"

      - name: Build platform installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.build_update_bundles && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ startsWith(matrix.platform, 'linux-') && '1' || '' }}
          NO_STRIP: ${{ startsWith(matrix.platform, 'linux-') && '1' || '' }}
          RUST_LOG: ${{ startsWith(matrix.platform, 'linux-') && 'tauri_bundler=debug' || '' }}
        run: pnpm --dir products/wanwei-desktop run build:runner:bundle --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/wanwei-${{ matrix.platform }}.json"

      # Tauri's DMG helper customizes Finder via AppleScript, which is
      # unreliable on hosted macOS runners. Package the already signed .app
      # with Apple's disk-image utility without requiring Finder automation.
      - name: Package macOS DMG
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="products/wanwei-desktop/src-tauri/target/release/bundle"
          app="$bundle_dir/macos/万维Buddy.app"
          test -d "$app"
          stage="${RUNNER_TEMP}/wanwei-dmg-${{ matrix.platform }}"
          mkdir -p "$stage" "$bundle_dir/dmg"
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          dmg="$bundle_dir/dmg/万维Buddy_${{ inputs.version }}_${{ matrix.platform }}.dmg"
          hdiutil create -srcfolder "$stage" -volname "万维Buddy" -format UDZO -ov "$dmg"
          hdiutil verify "$dmg"

      - name: Diagnose Linux AppImage bundler
        if: ${{ failure() && startsWith(matrix.platform, 'linux-') }}
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: |
          bundle_dir="products/wanwei-desktop/src-tauri/target/release/bundle"
          app_dir="$(find "$bundle_dir/appimage" -maxdepth 1 -type d -name '*.AppDir' -print -quit 2>/dev/null || true)"
          linuxdeploy="$(find "$HOME/.cache/tauri" -maxdepth 1 -type f -name "linuxdeploy-$(uname -m).AppImage" -print -quit 2>/dev/null || true)"
          echo "::group::Linux AppImage environment"
          command -v desktop-file-validate || true
          command -v mksquashfs || true
          command -v zsyncmake || true
          find "$bundle_dir" -maxdepth 3 -type f -print 2>/dev/null || true
          echo "::endgroup::"
          if [ -z "$linuxdeploy" ] || [ -z "$app_dir" ]; then
            echo "linuxdeploy or the generated AppDir is missing; see the file list above."
            exit 0
          fi
          echo "::group::linuxdeploy direct diagnostic"
          "$linuxdeploy" --appimage-extract-and-run --verbosity 3 \
            --appdir "$app_dir" --plugin gtk --output appimage || true
          echo "::endgroup::"

      - name: Upload Windows installer
        if: ${{ matrix.platform == 'windows-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-${{ inputs.version }}-windows-x64
          path: products/wanwei-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package signed desktop update
        if: ${{ inputs.build_update_bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node products/wanwei-desktop/scripts/package-update.mjs ${{ matrix.platform }}

      - name: Upload signed desktop update bundle
        if: ${{ inputs.build_update_bundles }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-update-${{ inputs.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/wanwei-update-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS installer
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-${{ inputs.version }}-${{ matrix.platform }}
          path: products/wanwei-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installers
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-${{ inputs.version }}-${{ matrix.platform }}
          path: |
            products/wanwei-desktop/src-tauri/target/release/bundle/deb/*.deb
            products/wanwei-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: ${{ inputs.publish_github_release }}
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wanwei-buddy-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wanwei-v${{ inputs.version }}
          name: 万维Buddy v${{ inputs.version }}
          prerelease: false
          files: release-assets/*
