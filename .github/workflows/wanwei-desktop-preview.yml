# Build the isolated Wanwei desktop preview. This workflow is manual-only and
# has no image, registry, OneAPI deployment, or database steps.
name: Wanwei desktop preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        default: new-version
        type: string
      version:
        description: Preview version without the v prefix (for example 0.2.0-preview.1)
        required: true
        type: string
      publish_github_release:
        description: Publish the generated installers as a preview GitHub Release
        required: true
        default: false
        type: boolean

concurrency:
  group: wanwei-desktop-preview-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22.19.0'
  DSH_RELEASE_VERSION: ${{ inputs.version }}
  DSH_DESKTOP_SERVER_URL: ${{ vars.DSH_ONEAPI_URL || 'http://ac.zjugis.com:3300' }}
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify-official:
    name: Verify official DSH composition
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-official-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product boundaries
        run: pnpm --dir products/wanwei-desktop run check:boundaries

      - name: Build official DSH composition
        run: pnpm run build:official

  build-desktop:
    name: Build ${{ matrix.name }} preview installer
    needs: verify-official
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-x64
            runner: windows-2025
            bundles: nsis
          - name: macOS arm64
            platform: macos-arm64
            runner: macos-15
            bundles: app,dmg
          - name: macOS Intel x64
            platform: macos-x64
            runner: macos-15-intel
            bundles: app,dmg
          - name: Linux x64
            platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-wanwei-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: ${{ matrix.platform == 'linux-x64' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            musl \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils \
            zsync
          # The staged runtime contains a static musl launcher. linuxdeploy
          # looks up its interpreter marker as a shared-library SONAME, while
          # Ubuntu exposes musl under the loader path below.
          sudo ln -sf /lib/ld-musl-x86_64.so.1 /usr/lib/x86_64-linux-gnu/libc.musl-x86_64.so.1
          sudo ldconfig

      - name: Cache Rust and Tauri output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            products/wanwei-desktop/src-tauri/target
          key: ${{ matrix.platform }}-wanwei-preview-${{ hashFiles('products/wanwei-desktop/src-tauri/Cargo.lock', 'products/wanwei-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-wanwei-preview-

      - name: Validate inputs and prepare platform config
        run: node products/wanwei-desktop/scripts/prepare-runner-config.mjs ${{ matrix.platform }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Wanwei product identity
        run: pnpm --dir products/wanwei-desktop run check:identity

      - name: Verify Wanwei product boundaries
        run: pnpm --dir products/wanwei-desktop run check:boundaries

      - name: Build DSH and desktop assets
        run: pnpm --dir products/wanwei-desktop run dev:prepare

      - name: Stage self-contained runtime
        run: pnpm --dir products/wanwei-desktop run prepare:runtime

      # pnpm's legacy production deploy prunes workspace development packages.
      # Restore the locked build toolchain before invoking the Tauri CLI.
      - name: Restore installer build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify staged runtime and sidecar
        run: pnpm --dir products/wanwei-desktop run check:runtime

      # The target directory is cached to speed up Rust compilation, but bundle
      # outputs are versioned artifacts and must never survive between runs.
      - name: Clear stale installer outputs
        run: |
          node -e "require('node:fs').rmSync('products/wanwei-desktop/src-tauri/target/release/bundle', { recursive: true, force: true })"

      - name: Build platform installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'linux-x64' && '1' || '' }}
          NO_STRIP: ${{ matrix.platform == 'linux-x64' && '1' || '' }}
          RUST_LOG: ${{ matrix.platform == 'linux-x64' && 'tauri_bundler=debug' || '' }}
        run: pnpm --dir products/wanwei-desktop run build:runner:bundle --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/wanwei-preview-${{ matrix.platform }}.json"

      - name: Diagnose Linux AppImage bundler
        if: ${{ failure() && matrix.platform == 'linux-x64' }}
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: |
          bundle_dir="products/wanwei-desktop/src-tauri/target/release/bundle"
          app_dir="$(find "$bundle_dir/appimage" -maxdepth 1 -type d -name '*.AppDir' -print -quit 2>/dev/null || true)"
          linuxdeploy="$(find "$HOME/.cache/tauri" -maxdepth 1 -type f -name 'linuxdeploy-x86_64.AppImage' -print -quit 2>/dev/null || true)"
          echo "::group::Linux AppImage environment"
          command -v desktop-file-validate || true
          command -v mksquashfs || true
          command -v zsyncmake || true
          find "$bundle_dir" -maxdepth 3 -type f -print 2>/dev/null || true
          echo "::endgroup::"
          if [ -z "$linuxdeploy" ] || [ -z "$app_dir" ]; then
            echo "linuxdeploy or the generated AppDir is missing; see the file list above."
            exit 0
          fi
          echo "::group::linuxdeploy direct diagnostic"
          "$linuxdeploy" --appimage-extract-and-run --verbosity 3 \
            --appdir "$app_dir" --plugin gtk --output appimage || true
          echo "::endgroup::"

      - name: Upload Windows preview installer
        if: ${{ matrix.platform == 'windows-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-windows-x64
          path: products/wanwei-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS preview installer
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-${{ matrix.platform }}
          path: products/wanwei-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux preview installers
        if: ${{ matrix.platform == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-linux-x64
          path: |
            products/wanwei-desktop/src-tauri/target/release/bundle/deb/*.deb
            products/wanwei-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish preview release
    if: ${{ inputs.publish_github_release }}
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wanwei-buddy-preview-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wanwei-preview-v${{ inputs.version }}
          name: 万维 Buddy 预览版 v${{ inputs.version }}
          prerelease: true
          files: release-assets/*
