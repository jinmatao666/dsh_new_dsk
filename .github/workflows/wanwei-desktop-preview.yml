# Build the isolated Wanwei desktop preview. This workflow is manual-only and
# has no image, registry, OneAPI deployment, or database steps.
name: Wanwei desktop preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version without the v prefix (for example 0.2.0-preview.1)
        required: true
        type: string
      publish_github_release:
        description: Publish the generated installers as a preview GitHub Release
        required: true
        default: false
        type: boolean

concurrency:
  group: wanwei-desktop-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22.19.0'
  DSH_RELEASE_VERSION: ${{ inputs.version }}
  DSH_DESKTOP_SERVER_URL: ${{ vars.DSH_ONEAPI_URL || 'http://ac.zjugis.com:3300' }}
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-desktop:
    name: Build ${{ matrix.name }} preview installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-x64
            runner: windows-2025
            bundles: nsis
          - name: macOS arm64
            platform: macos-arm64
            runner: macos-15
            bundles: dmg
          - name: Linux x64
            platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-wanwei-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: ${{ matrix.platform == 'linux-x64' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Rust and Tauri output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            products/wanwei-desktop/src-tauri/target
          key: ${{ matrix.platform }}-wanwei-preview-${{ hashFiles('products/wanwei-desktop/src-tauri/Cargo.lock', 'products/wanwei-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-wanwei-preview-

      - name: Validate inputs and prepare platform config
        run: node products/wanwei-desktop/scripts/prepare-runner-config.mjs ${{ matrix.platform }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build self-contained installer
        run: pnpm --dir products/wanwei-desktop run build:runner -- --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/wanwei-preview-${{ matrix.platform }}.json"

      - name: Upload Windows preview installer
        if: ${{ matrix.platform == 'windows-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-windows-x64
          path: products/wanwei-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS preview installer
        if: ${{ matrix.platform == 'macos-arm64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-macos-arm64
          path: products/wanwei-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux preview installers
        if: ${{ matrix.platform == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-preview-${{ inputs.version }}-linux-x64
          path: |
            products/wanwei-desktop/src-tauri/target/release/bundle/deb/*.deb
            products/wanwei-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish preview release
    if: ${{ inputs.publish_github_release }}
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wanwei-buddy-preview-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wanwei-preview-v${{ inputs.version }}
          name: 万维 Buddy 预览版 v${{ inputs.version }}
          prerelease: true
          files: release-assets/*
