name: Wanwei Buddy Kylin compatibility

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit
        default: new-version
        required: true
        type: string
      version:
        description: Release version (x.y.z)
        default: '1.0.2'
        required: true
        type: string
      official_release:
        description: Official release identity
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        required: true
        type: string
      official_release:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-kylin:
    name: Kylin ${{ matrix.arch }} (glibc 2.31 / WebKit 4.0)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      DSH_RELEASE_VERSION: ${{ inputs.version }}
      DSH_RELEASE_OFFICIAL: ${{ inputs.official_release }}
      DSH_DESKTOP_SERVER_URL: ${{ vars.DSH_ONEAPI_URL || 'http://ac.zjugis.com:3300' }}
      DSH_TELEMETRY_DISABLED: '1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
      TAURI_TRAY: appindicator
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install old Linux build baseline
        run: |
          apt-get update
          apt-get install --yes build-essential binutils ca-certificates curl git pkg-config xz-utils \
            libwebkit2gtk-4.0-dev libgtk-3-dev libappindicator3-dev libssl-dev librsvg2-dev \
            libxdo-dev libfuse2 musl patchelf desktop-file-utils squashfs-tools zsync \
            xdg-utils file wget xvfb xauth dbus-x11 python3
          case "$(uname -m)" in
            x86_64) node_arch=x64; library_arch=x86_64-linux-gnu ;;
            aarch64) node_arch=arm64; library_arch=aarch64-linux-gnu ;;
            *) exit 1 ;;
          esac
          curl --fail --location --output /tmp/node.tar.xz "https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-$node_arch.tar.xz"
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.100.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          ln -sf "/lib/ld-musl-$(uname -m).so.1" "/usr/lib/$library_arch/libc.musl-$(uname -m).so.1"
          ldconfig

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            products/wanwei-desktop/src-kylin/target
          key: kylin-focal-${{ matrix.arch }}-rust1100-cli163-${{ hashFiles('products/wanwei-desktop/src-kylin/Cargo.lock', 'products/wanwei-desktop/src-kylin/Cargo.toml', 'pnpm-lock.yaml') }}

      - name: Install pinned Tauri 1 CLI
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -q '1.6.3'; then
            cargo install tauri-cli --version 1.6.3 --locked
          fi

      - name: Install workspace and build shared business runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir products/wanwei-desktop run check:identity
          pnpm --dir products/wanwei-desktop run dev:prepare
          pnpm --dir products/wanwei-desktop run prepare:runtime
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir products/wanwei-desktop run check:runtime
          node --test products/wanwei-desktop/scripts/kylin.test.mjs
          node products/wanwei-desktop/scripts/prepare-kylin.mjs

      - name: Compile and test Kylin shell
        working-directory: products/wanwei-desktop/src-kylin
        run: |
          python3 test-baseline.py
          cargo test --locked --all-targets
          cargo build --locked
          python3 smoke.py
          cargo build --locked --release --features custom-protocol
          python3 check-baseline.py --arch '${{ matrix.arch }}' --report baseline-runtime.json \
            target/release/wanwei-buddy-kylin resources

      - name: Build Kylin installers
        working-directory: products/wanwei-desktop/src-kylin
        run: |
          rm -rf target/release/bundle target/kylin-installers
          cargo tauri build --config tauri.runner.conf.json --bundles deb,appimage -- --locked
          python3 check-installers.py --arch '${{ matrix.arch }}'

      - name: Give compatibility installers distinct release names
        working-directory: products/wanwei-desktop/src-kylin
        run: |
          mkdir -p target/kylin-installers
          for installer in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
            filename="$(basename "$installer")"
            cp "$installer" "target/kylin-installers/${filename%.*}-kylin.${filename##*.}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wanwei-buddy-${{ inputs.version }}-kylin-${{ matrix.arch }}
          path: products/wanwei-desktop/src-kylin/target/kylin-installers/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: wanwei-kylin-evidence-${{ inputs.version }}-${{ matrix.arch }}
          path: |
            products/wanwei-desktop/src-kylin/baseline-*.json
            products/wanwei-desktop/src-kylin/smoke.log
            products/wanwei-desktop/src-kylin/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
