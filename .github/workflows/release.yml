name: Release DSH Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 1.0.2-private.1)
        required: true
        type: string
      platform_scope:
        description: Platforms to build
        required: true
        default: windows-only
        type: choice
        options:
          - windows-only
          - all-platforms
      publish_github_release:
        description: Publish installers as a GitHub Release after successful builds
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORM_SCOPE: ${{ inputs.platform_scope }}
        run: |
          python3 - <<'PY'
          import json
          import os
          platforms = [
              {"platform": "windows-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundles": "nsis", "node_archive": "", "node_dir": ""},
              {"platform": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "bundles": "app,dmg", "node_archive": "node-v22.19.0-darwin-arm64.tar.gz", "node_dir": "node-v22.19.0-darwin-arm64"},
              # Use an Intel runner for x64. Native dependencies such as sharp
              # are selected while pnpm stages the sidecar runtime, so an ARM
              # host cannot reliably package an x64-native dependency tree.
              {"platform": "macos-x64", "os": "macos-13", "target": "x86_64-apple-darwin", "bundles": "app,dmg", "node_archive": "node-v22.19.0-darwin-x64.tar.gz", "node_dir": "node-v22.19.0-darwin-x64"},
          ]
          if os.environ["PLATFORM_SCOPE"] == "windows-only":
              platforms = platforms[:1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": platforms}, separators=(",", ":")) + "\n")
          PY

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      DSH_RELEASE_VERSION: ${{ inputs.version }}
      # One repository corresponds to one deployment region. Set DSH_ONEAPI_URL
      # as a repository variable before releasing for another region.
      DSH_ONEAPI_URL: ${{ vars.DSH_ONEAPI_URL || 'http://ac.zjugis.com:3300' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The release version is supplied explicitly; no build step needs
          # the complete repository history.
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust and Tauri build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-tauri-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-tauri-
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$DSH_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $DSH_RELEASE_VERSION" >&2
            exit 1
          }
          test -n "$DSH_ONEAPI_URL"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare production server config and app version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const server = path.join(process.env.RUNNER_TEMP, 'dsh-server.json')
          const config = path.join(process.env.RUNNER_TEMP, 'dsh-version.json')
          fs.writeFileSync(server, JSON.stringify({ oneApiUrl: process.env.DSH_ONEAPI_URL, defaultModel: '' }, null, 2) + '\n')
          fs.writeFileSync(config, JSON.stringify({ version: process.env.DSH_RELEASE_VERSION }))
          fs.appendFileSync(process.env.GITHUB_ENV, `DSH_DESKTOP_SERVER_CONFIG=${server}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `DSH_TAURI_VERSION_CONFIG=${config}\n`)
          NODE
      - name: Prepare target Node runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODE_ARCHIVE: ${{ matrix.node_archive }}
          NODE_DIR: ${{ matrix.node_dir }}
        run: |
          curl --fail --location --retry 5 \
            "https://nodejs.org/dist/v22.19.0/$NODE_ARCHIVE" \
            --output "$RUNNER_TEMP/$NODE_ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$NODE_ARCHIVE" -C "$RUNNER_TEMP"
          echo "DSH_NODE_BINARY=$RUNNER_TEMP/$NODE_DIR/bin/node" >> "$GITHUB_ENV"
      - name: Select target Node runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "DSH_NODE_BINARY=$((Get-Command node).Source)"
      - name: Stage desktop runtime
        run: pnpm --filter @deepseek-ai/dsh-desktop-app run prepare:runtime
      # `pnpm deploy --prod` stages a separate production tree and can prune
      # workspace-linked development binaries. Restore the desktop package's
      # CLI before generating icons and invoking Tauri packaging.
      - name: Restore packaging tools
        run: pnpm install --frozen-lockfile --prod=false
      - name: Generate ZJUGIS desktop icons
        run: pnpm --filter @deepseek-ai/dsh-desktop-app exec tauri icon src-tauri/icons/zjugis-mark-source.png
      - name: Build desktop installers
        shell: bash
        run: |
          # The target directory is cached for Rust/Tauri compilation speed.
          # Bundle artifacts are versioned outputs, however, and stale files
          # from a restored cache must never be published with this release.
          rm -rf "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          set +e
          pnpm --filter @deepseek-ai/dsh-desktop-app exec tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "$DSH_TAURI_VERSION_CONFIG"
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ] && [ "${{ matrix.platform }}" != "windows-x64" ]; then
            script="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/bundle_dmg.sh"
            if [ -f "$script" ]; then
              echo "::group::DMG bundler diagnostic"
              bash -x "$script" || true
              echo "::endgroup::"
            fi
          fi
          exit "$build_status"
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            -name "*_${DSH_RELEASE_VERSION}_*" \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ inputs.version }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_github_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ZJUGIS Harness v${{ inputs.version }}
          files: release-assets/*
