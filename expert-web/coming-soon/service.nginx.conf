worker_processes auto;
pid /tmp/wanwei-coming-soon.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    default_type text/html;
    charset utf-8;
    server_tokens off;
    server {
        listen 127.0.0.1:3317;
        server_name _;
        root /usr/share/nginx/wanwei-coming-soon;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-RLq5A/CL8xR2yhpZZS3lLI257Y57KRlp6gVxrQ+lh2Y='; style-src 'sha256-wS4m1ByH0jQNhndIULRM9+XGFbIENSsWqdJL+tuS+PU='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        location = / { try_files /index.html =404; }
        location = /index.html { }
        location / { return 404; }
    }
}
