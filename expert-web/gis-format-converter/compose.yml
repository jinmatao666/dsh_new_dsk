services:
  expert:
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3308"
      EXPERT_DATA_DIR: /data
      # Container pids_limit is tight; OpenBLAS/numpy default to many threads and crash imports.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - gis_format_converter_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2048m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 190s
volumes:
  gis_format_converter_data:
