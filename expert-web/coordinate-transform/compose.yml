services:
  expert:
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3307"
      EXPERT_DATA_DIR: /data
    volumes:
      - coordinate_transform_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2048m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 190s
volumes:
  coordinate_transform_data:
