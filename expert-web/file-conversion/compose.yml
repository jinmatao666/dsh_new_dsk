services:
  conversion:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4301"
      EXPERT_DATA_DIR: /data
    ports:
      - "127.0.0.1:4301:4301"
    volumes:
      - conversion-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2
    pids_limit: 96
    stop_grace_period: 190s
volumes:
  conversion-data:
