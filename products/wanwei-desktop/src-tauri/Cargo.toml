[package]
name = "wanwei-buddy-preview"
version = "0.1.0"
description = "Wanwei Buddy preview desktop shell"
authors = ["Wanwei"]
edition = "2021"

[lib]
name = "wanwei_buddy_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
