[package]
name = "wanwei-buddy-preview"
version = "0.1.0"
description = "Wanwei Buddy preview desktop shell"
authors = ["Wanwei"]
edition = "2021"

[lib]
name = "wanwei_buddy_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
