[package]
name = "wanwei-buddy-kylin"
version = "0.1.0"
description = "Wanwei Buddy Kylin compatibility shell"
authors = ["Wanwei"]
edition = "2021"
publish = false
build = "../src-tauri/build.rs"

[lib]
name = "wanwei_buddy_lib"
path = "../src-tauri/src/lib.rs"

[[bin]]
name = "wanwei-buddy-kylin"
path = "../src-tauri/src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = [ "shell-open", "system-tray", "icon-png", "dialog", "shell-open-api", "window-data-url"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1e407ed56455558cf751022fd68eca3b9e3713a0" }
gtk = "0.15"
glib = "0.15"
gio = "0.15"
webkit2gtk = { version = "0.18", features = ["v2_22"] }
javascriptcore-rs = "=0.16.0"
base64 = "0.22"
clipboard-rs = { version = "=0.3.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0

[profile.release]
strip = false
