# Desktop is a narrow overlay over dsh-base + dsh-web-app. It adds login and
# model-provider synchronization without replacing any native DSH client row.
- id: ui-settings-models
  # Models are issued and governed by the regional OneAPI console.  Do not
  # expose local provider/API-key editing in customer desktop installations.
  disabled: true

# Customer desktop installations use the server-governed Model Server only.
# Do not expose legacy direct-DeepSeek credentials or provider rows.
- id: llm-deepseek
  disabled: true

# Keep deployment-specific operational guidance close to the desktop profile.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      For ordinary local PDF, DOCX and XLSX reading, always use the bundled
      extract_document tool rather than probing or installing Python libraries.
      If it returns needs_vision for a scanned PDF, use configured vision/OCR;
      do not make a formal review conclusion until the source material is read.
      Do not invoke pip, install packages at runtime, or use the system python
      command for routine document extraction. Python is only for an explicitly
      requested specialised workflow with a configured interpreter. When such
      a specialised workflow genuinely requires a missing package, use
      `python -m pip install --user <package>` only; never use `--target`
      and never install packages inside a workspace. The desktop provides a
      shared per-user Python package and cache location for this purpose.
      On Windows, use PowerShell `Get-Command` to check executables; do not
      invoke `where.exe`.
      When a user attaches an image to the conversation and the active model
      supports image input, inspect that attachment directly instead of asking
      the user to select the same image from the workspace. Never invent or
      derive a filesystem path for a chat attachment, and never call
      `recognize_image` for it. `recognize_image` is reserved only for an
      explicit, existing local filesystem path supplied by the user.
      When creating a requested deliverable such as a PPTX, DOCX, XLSX or PDF,
      verify the final deliverable file exists and mention its exact filename
      in the final response. Do not present only a helper source script as the
      result when the requested deliverable was created successfully.

- insert:
    - id: ui-oneapi-auth
      name: '@deepseek-ai/dsh-client-ui-oneapi-auth'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        provider: dsh-server
        credentialRef: DSH_ONEAPI_TOKEN
        tokenName: DSH Desktop Auto Token
        # The desktop synchronizes each model's input modalities from OneAPI
        # after login.  This is only a safe text fallback for older servers.
        defaultInput: [text]
        defaultModel: !!js process.env.DSH_DEFAULT_MODEL
        installId: !!js process.env.DSH_INSTALL_ID
    - id: dsh-vision
      name: '@deepseek-ai/dsh-vision'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        credentialRef: DSH_ONEAPI_TOKEN
    - id: dsh-document-local
      name: '@deepseek-ai/dsh-document-local'
    - id: ui-skill-marketplace
      name: '@deepseek-ai/dsh-client-ui-skill-marketplace'
