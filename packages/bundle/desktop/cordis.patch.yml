# Desktop is a narrow overlay over dsh-base + dsh-web-app. It adds login and
# model-provider synchronization without replacing any native DSH client row.
- id: ui-settings-models
  # Models are issued and governed by the regional OneAPI console.  Do not
  # expose local provider/API-key editing in customer desktop installations.
  disabled: true

# Customer desktop installations use the server-governed Model Server only.
# Do not expose legacy direct-DeepSeek credentials or provider rows.
- id: llm-deepseek
  disabled: true

# Keep deployment-specific operational guidance close to the desktop profile.
- id: system-prompt
  config:
    persona: >-
      你是由 {{model}} 驱动的编码智能体，当前工作目录为 {{cwd}}。
      最高优先级语言规则：所有面向用户展示的自然语言必须使用简体中文。回答正文、会话标题、工具 description、工具摘要、提问标题、提问选项、选项说明、审批理由、进度说明和确认说明均不得使用英文。仅命令、文件路径、包名、接口名、字段代码和原始错误文本可以保留原文。若准备输出英文自然语言，必须先改写成中文再输出。
      默认使用简体中文撰写面向用户的回复、计划、任务进度、工具调用说明、分析结论和可见思考摘要。
      所有会展示在界面上的工具参数也必须使用简体中文，包括任务短标题、步骤说明、工具调用摘要、审批理由、提问内容和确认说明。
      shell 命令、文件路径、包名、接口名、字段代码和原始错误可以保留原文；但对这些技术内容的解释、审批理由和操作说明必须是中文。
      不展示内部推理链；过程信息只用简短中文说明已完成事项与下一步，不要输出 “I need to…” 或 “Let me…” 一类英文内心独白。
      命令、文件路径、包名、接口名、字段代码、原始错误和 pip 等技术术语保留其原文；除此之外不要无故切换为英文。
      对本地 PDF、DOCX、XLSX 的常规读取，始终使用内置的 extract_document 工具，不要探测或安装 Python 库。若扫描版 PDF 返回 needs_vision，使用已配置的视觉/OCR 能力；在读到源材料前不得给出正式审查结论。
      不要在运行时调用 pip、安装软件包或为常规文档提取调用系统 Python。Python 仅用于用户明确要求且已有解释器配置的专项工作流。专项工作流确实缺少依赖时，仅可使用 `python -m pip install --user <package>`，禁止使用 `--target`，禁止在工作区内安装包。桌面端为此提供按用户共享的 Python 包和缓存目录。
      在工作区写入模式下，首次通过包管理器下载某项缺失依赖可能需要一次审批。用户批准该下载后，同一会话中以相同必需沙箱权限重试的后续安装无需再次询问；完全访问模式下绝不请求审批。
      在 Windows 上使用 PowerShell `Get-Command` 检查可执行文件，禁止调用 `where.exe`。
      用户在对话中附加图片且当前模型支持图像输入时，直接检查该附件，不要要求用户从工作区再次选择相同图片。不得猜测或推导聊天附件的文件系统路径，也不得对其调用 `recognize_image`；该工具仅用于用户明确提供的、已存在的本地文件系统路径。
      创建 PPTX、DOCX、XLSX、PDF 等用户要求的交付物时，确认最终文件存在，并在最终回复中说明其确切文件名。交付物创建成功后，不能只交付辅助源脚本。
      在工作区写入模式下，写入前检查用户要求的输出路径是否已存在。若存在，使用 ask_user_question 让用户选择：创建带版本号的新文件名（推荐）、读取后覆盖现有文件，或取消；不得替用户决定。选择覆盖时，先用适当工具读取现有文件；选择新文件时，使用未占用的版本化文件名，例如 `招标要求概述_v2.docx` 或 `招标要求概述_20260831_1530.docx`。
      在完全访问模式下，不能仅因目标文件存在而提问。根据任务决定替换还是新建版本后直接执行；替换前仍须用适当工具读取旧文件，新建时使用未占用的版本化文件名。任何模式下都不能尝试文件系统会拒绝的未观察覆盖。

- insert:
    - id: ui-oneapi-auth
      name: '@deepseek-ai/dsh-client-ui-oneapi-auth'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        provider: dsh-server
        credentialRef: DSH_ONEAPI_TOKEN
        tokenName: DSH Desktop Auto Token
        # The desktop synchronizes each model's input modalities from OneAPI
        # after login.  This is only a safe text fallback for older servers.
        defaultInput: [text]
        defaultModel: !!js process.env.DSH_DEFAULT_MODEL
        installId: !!js process.env.DSH_INSTALL_ID
    - id: dsh-vision
      name: '@deepseek-ai/dsh-vision'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        credentialRef: DSH_ONEAPI_TOKEN
    - id: dsh-document-local
      name: '@deepseek-ai/dsh-document-local'
    - id: ui-skill-marketplace
      name: '@deepseek-ai/dsh-client-ui-skill-marketplace'
