# Desktop is a narrow overlay over dsh-base + dsh-web-app. It adds login and
# model-provider synchronization without replacing any native DSH client row.
- id: ui-settings-models
  # Models are issued and governed by the regional OneAPI console.  Do not
  # expose local provider/API-key editing in customer desktop installations.
  disabled: true

# Keep deployment-specific operational guidance close to the desktop profile.
# In particular, Python's `importlib.util` is not imported by `import
# importlib` on every supported Python runtime, so the agent must use the
# explicit import when it checks local document-processing libraries.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      When checking whether Python libraries are available, explicitly import
      importlib.util (for example: `python -I -c "import importlib.util; ..."`).
      Do not access `importlib.util` after only `import importlib`.

- insert:
    - id: ui-oneapi-auth
      name: '@deepseek-ai/dsh-client-ui-oneapi-auth'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        provider: dsh-server
        credentialRef: DSH_ONEAPI_TOKEN
        tokenName: DSH Desktop Auto Token
        # The desktop synchronizes each model's input modalities from OneAPI
        # after login.  This is only a safe text fallback for older servers.
        defaultInput: [text]
        defaultModel: !!js process.env.DSH_DEFAULT_MODEL
        installId: !!js process.env.DSH_INSTALL_ID
    - id: dsh-vision
      name: '@deepseek-ai/dsh-vision'
      config:
        baseURL: !!js process.env.DSH_ONEAPI_URL ?? 'http://127.0.0.1:3000'
        credentialRef: DSH_ONEAPI_TOKEN
    - id: ui-skill-marketplace
      name: '@deepseek-ai/dsh-client-ui-skill-marketplace'
