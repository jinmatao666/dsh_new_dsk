# Wanwei-owned product layer over dsh-base and dsh-web-app. Private features
# enter through this layer instead of editing either official bundle.
- id: llm-deepseek
  disabled: true

- id: ui-settings-models
  disabled: true

- id: web
  config:
    searchProvider: oneapi-bailian

- insert:
    - id: wanwei-chinese
      name: '@deepseek-ai/dsh-wanwei-chinese'
    - id: wanwei-oneapi-auth
      name: '@deepseek-ai/dsh-wanwei-oneapi-auth'
      config:
        provider: dsh-server
        credentialRef: DSH_ONEAPI_TOKEN
        tokenName: DSH Desktop Auto Token
        defaultInput: [text]
        defaultModel: !!js process.env.DSH_DEFAULT_MODEL
        installId: !!js process.env.DSH_INSTALL_ID
        developmentBypass: !!js process.env.DSH_DESKTOP_DEVELOPMENT === '1'
    - id: wanwei-document-local
      name: '@deepseek-ai/dsh-wanwei-document-local'
    - id: wanwei-vision
      name: '@deepseek-ai/dsh-wanwei-vision'
      config:
        credentialRef: DSH_ONEAPI_TOKEN
    - id: wanwei-skill-marketplace
      name: '@deepseek-ai/dsh-wanwei-skill-marketplace'
    - id: wanwei-product-ui
      name: '@deepseek-ai/dsh-wanwei-product-ui'
    - id: wanwei-skillhub
      name: '@deepseek-ai/dsh-wanwei-skillhub'
      config:
        baseURL: https://api.skillhub.cn
        timeoutMs: 45000
        maxJsonBytes: 2097152
        maxArchiveBytes: 16777216
        downloadHosts: [skillhub-1388575217.cos.accelerate.myqcloud.com]
