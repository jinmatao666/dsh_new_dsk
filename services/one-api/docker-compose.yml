version: '3.4'

services:
  one-api:
    image: justsong/one-api:latest
    container_name: one-api
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      SQL_DSN: ${SQL_DSN:?SQL_DSN is required}
      ACCOUNT_SQL_DSN: ${ACCOUNT_SQL_DSN:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TZ: Asia/Shanghai
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://tauri.localhost,tauri://localhost}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
