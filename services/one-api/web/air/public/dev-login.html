<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>本地开发 · 跳过登录进入技能管理</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #334; }
    .card { background: #fff; border: 1px solid #e3e8f0; border-radius: 14px; padding: 28px 32px; max-width: 420px; box-shadow: 0 8px 24px rgba(40, 70, 120, .08); }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 6px 0; font-size: 13px; line-height: 1.7; color: #667; }
    code { background: #f0f3f8; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    a.btn { display: inline-block; margin-top: 14px; padding: 8px 18px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>已写入本地超管身份</h1>
    <p>本页仅用于<strong>本地开发预览</strong>：向 <code>localStorage</code> 写入一个
      <code>role: 100</code> 的模拟超管用户，随后跳转技能管理页。不会请求任何服务器接口。</p>
    <p>页面本身全靠 <code>localStorage.getItem('user')</code> 与 <code>user.role &gt;= 100</code>
      判断登录与权限，因此无需后端即可完成绕过。正式打包前请删除本文件（<code>public/dev-login.html</code>）。</p>
    <a class="btn" href="/skill">进入技能管理 →</a>
  </div>
  <script>
    // 模拟超管：PrivateRoute 只查 localStorage 'user'，PermissionGuard/isRoot 只看 role >= 100。
    localStorage.setItem('user', JSON.stringify({
      id: 1,
      username: 'dev-admin',
      display_name: '本地开发（未登录）',
      role: 100,
      status: 1,
      group: 'default',
      quota: 999999999,
      used_quota: 0,
      request_count: 0,
      aff_code: '',
      admin_permissions: '[]'
    }));
    localStorage.setItem('system_name', 'ZJUGIS Harness');
    // 直接落到技能管理页；若被路由重定向回登录页，可用上方按钮重试。
    location.replace('/skill');
  </script>
</body>
</html>
