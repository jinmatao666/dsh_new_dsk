- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: repeat-tool-reminder
  config:
    failureRecovery: true
    invalidRetryLimit: 3
    failureMemorySize: 128

- id: llm-deepseek
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
